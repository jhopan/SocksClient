name: Sample GUI probe (sementara)

# Sekali pakai: bangun aplikasi contoh Fyne dan Gio, jalankan di Xvfb,
# screenshot, dan ukur ukuran binary + RSS. Dihapus setelah hasil didapat.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Fyne: GL + X11/Wayland headers. Gio: tambahan EGL/Vulkan/xkbcommon-x11.
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev libvulkan-dev \
            xvfb xdotool imagemagick >/dev/null

      - name: Build both samples
        run: |
          mkdir -p /tmp/out
          (cd samples/gui/fyneapp && go mod tidy >/dev/null 2>&1 && \
             go build -ldflags "-s -w" -o /tmp/out/fyneapp .)
          (cd samples/gui/gioapp  && go mod tidy >/dev/null 2>&1 && \
             go build -ldflags "-s -w" -o /tmp/out/gioapp .)
          echo "=== ukuran binary"
          ls -l /tmp/out | awk '{print $5, $9}'
          echo "FYNE_BYTES=$(stat -c%s /tmp/out/fyneapp)"
          echo "GIO_BYTES=$(stat -c%s /tmp/out/gioapp)"

      - name: Run under Xvfb, screenshot, measure RSS
        run: |
          mkdir -p /tmp/shots
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          run_one() {
            name="$1"; shift
            export LIBGL_ALWAYS_SOFTWARE=1
            "$@" >"/tmp/$name.log" 2>&1 &
            sleep 12
            pid=$(pgrep -f "/tmp/out/$name" | head -1)
            if [ -z "$pid" ]; then echo "$name: MATI - log:"; tail -8 "/tmp/$name.log"; return; fi
            rss=$(ps -o rss= -p "$pid" | tr -d ' ')
            echo "$name: hidup pid=$pid RSS=$(awk "BEGIN{printf \"%.1f\", $rss/1024}") MB thread=$(ps -o nlwp= -p $pid | tr -d ' ')"
            import -window root "/tmp/shots/$name.png" 2>/dev/null || true
            ls -l "/tmp/shots/$name.png" 2>/dev/null || echo "$name: screenshot gagal"
            kill "$pid" 2>/dev/null || true
            sleep 2
          }
          run_one fyneapp /tmp/out/fyneapp
          run_one gioapp  /tmp/out/gioapp

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-samples-screenshots
          path: /tmp/shots/*.png
          if-no-files-found: warn
