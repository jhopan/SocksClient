name: CI (Android)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fetch core (libbox.aar)
        run: bash scripts/fetch-core.sh

      # Compile untuk memastikan perubahan Java tetap bersih...
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      # ...dan lint sebagai gerbang kualitas dasar (unused resource, API level,
      # permission yang tidak dipakai, dsb).
      - name: Lint
        run: ./gradlew :app:lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
