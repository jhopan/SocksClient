name: GUI run probe (sementara)

# Sekali pakai: jalankan GUI GTK3 sungguhan di bawah Xvfb, sebagai root (TUN
# butuh root), lalu periksa jendelanya benar-benar terbentuk (xdotool) dan
# prosesnya tetap hidup. Dihapus setelah hasilnya didapat.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-gtk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GTK3 + Xvfb + xdotool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev xvfb xdotool >/dev/null

      - name: Build and run the real GUI under Xvfb
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/socksgui ./cmd/socksgui-gtk
          sudo /usr/bin/Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          sudo env DISPLAY=:99 /tmp/socksgui -core /bin/true >/tmp/gui.log 2>&1 &
          sleep 12
          pid=$(pgrep -f "/tmp/socksgui" | head -1)
          if [ -n "$pid" ]; then
            echo "GUI masih hidup (pid $pid)"
            ps -o pid=,rss=,vsz=,nlwp= -p "$pid" | sed 's/^/ps: /'
            echo "RSS_MB=$(awk "BEGIN{printf \"%.1f\", $(ps -o rss= -p "$pid")/1024}")"
          else
            echo "GUI MATI setelah 12 detik - log:"; cat /tmp/gui.log
          fi
          echo "--- jendela yang terdeteksi X:"
          DISPLAY=:99 xdotool search --name "Socks Client" 2>/dev/null | while read -r w; do
            echo "window $w: $(DISPLAY=:99 xdotool getwindowname "$w" 2>/dev/null)"
          done || true
          echo "--- log GUI (10 baris):"; tail -10 /tmp/gui.log || true
          sudo pkill -f /tmp/socksgui || true
