name: UI size probe 2 (sementara)

# Sekali pakai: mengukur dua opsi GUI paling ringan.
#  - Linux : GTK3 lewat gotk3 (toolkit sistem, seperti walk memakai user32/comctl32)
#  - macOS : AppKit langsung lewat cgo/ObjC (framework OS, tanpa dependency pihak ketiga)
# Dihapus setelah angkanya didapat.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-gtk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GTK3 dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev >/dev/null
          pkg-config --modversion gtk+-3.0

      # gotk3 v0.6.4 tidak bisa dikompilasi di Go 1.25 (kode callback lama rusak),
      # jadi yang diukur adalah jalur yang setara walk: panggil toolkit OS langsung
      # lewat cgo.
      - name: Build GTK3 hello world (cgo langsung, tanpa binding pihak ketiga)
        run: |
          W="$RUNNER_TEMP/p2"; mkdir -p "$W/gtk" && cd "$W/gtk"
          cat > main.go <<'EOF'
          package main

          /*
          #cgo pkg-config: gtk+-3.0
          #include <gtk/gtk.h>

          static void on_connect(GtkWidget *w, gpointer data) {
              gtk_label_set_text(GTK_LABEL(data), "Connecting...");
          }

          static void run_app(void) {
              gtk_init(NULL, NULL);
              GtkWidget *win = gtk_window_new(GTK_WINDOW_TOPLEVEL);
              gtk_window_set_title(GTK_WINDOW(win), "Socks Client");
              gtk_window_set_default_size(GTK_WINDOW(win), 420, 520);
              GtkWidget *box = gtk_box_new(GTK_ORIENTATION_VERTICAL, 8);
              GtkWidget *entry = gtk_entry_new();
              gtk_entry_set_placeholder_text(GTK_ENTRY(entry), "10.0.0.1");
              GtkWidget *label = gtk_label_new("Status: Disconnected");
              GtkWidget *btn = gtk_button_new_with_label("Connect");
              g_signal_connect(btn, "clicked", G_CALLBACK(on_connect), label);
              gtk_box_pack_start(GTK_BOX(box), entry, FALSE, FALSE, 0);
              gtk_box_pack_start(GTK_BOX(box), btn, FALSE, FALSE, 0);
              gtk_box_pack_start(GTK_BOX(box), label, FALSE, FALSE, 0);
              gtk_container_add(GTK_CONTAINER(win), box);
              g_signal_connect(win, "destroy", G_CALLBACK(gtk_main_quit), NULL);
              gtk_widget_show_all(win);
              gtk_main();
          }
          */
          import "C"

          func main() { C.run_app() }
          EOF
          printf 'module gtktest\n\ngo 1.25\n' > go.mod
          go build -ldflags="-s -w" -o gtktest .
          ls -la gtktest
          echo "GTK_LINUX_BYTES=$(stat -c%s gtktest)" >> $GITHUB_ENV

      - name: Report
        run: |
          echo "=== GTK3 (gotk3) binary: $GTK_LINUX_BYTES bytes"
          ldd "$RUNNER_TEMP/p2/gtk/gtktest" 2>/dev/null | awk '{print $1}' | head -20

  macos-appkit:
    runs-on: macos-14
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build AppKit hello world (cgo + ObjC, tanpa dependency)
        run: |
          W="$RUNNER_TEMP/p2"; mkdir -p "$W/cocoa" && cd "$W/cocoa"
          cat > main.go <<'EOF'
          package main

          /*
          #cgo CFLAGS: -x objective-c
          #cgo LDFLAGS: -framework Cocoa -framework Foundation
          #import <Cocoa/Cocoa.h>

          static void run_app(void) {
              [NSApplication sharedApplication];
              [NSApp setActivationPolicy:NSApplicationActivationPolicyRegular];
              NSWindow *w = [[NSWindow alloc] initWithContentRect:NSMakeRect(0,0,420,520)
                  styleMask:(NSWindowStyleMaskTitled|NSWindowStyleMaskClosable)
                  backing:NSBackingStoreBuffered defer:NO];
              [w setTitle:@"Socks Client"];
              NSTextField *host = [[NSTextField alloc] initWithFrame:NSMakeRect(20,460,380,24)];
              [host setPlaceholderString:@"10.0.0.1"];
              NSButton *btn = [[NSButton alloc] initWithFrame:NSMakeRect(20,410,380,32)];
              [btn setTitle:@"Connect"];
              [[w contentView] addSubview:host];
              [[w contentView] addSubview:btn];
              [w center];
              [w makeKeyAndOrderFront:nil];
              [NSApp activateIgnoringOtherApps:YES];
              [NSApp run];
          }
          */
          import "C"

          func main() { C.run_app() }
          EOF
          printf 'module cocoatest\n\ngo 1.25\n' > go.mod
          go build -ldflags="-s -w" -o cocoatest .
          ls -la cocoatest
          echo "COCOA_BYTES=$(stat -c%s cocoatest)" >> $GITHUB_ENV
          du -sh /System/Library/Frameworks/AppKit.framework 2>/dev/null | sed 's/^/AppKit (bagian dari OS): /'

      - name: Report
        run: |
          echo "=== AppKit (cgo/ObjC) binary: $COCOA_BYTES bytes"
          otool -L "$RUNNER_TEMP/p2/cocoa/cocoatest" 2>/dev/null | head -10
