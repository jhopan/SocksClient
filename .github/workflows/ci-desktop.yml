name: CI (Desktop)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  
  gui-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Gio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev libvulkan-dev >/dev/null

      - name: Vet and build Gio GUI
        run: |
          go vet ./internal/... ./cmd/socksctl ./cmd/socksgui-gio
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/socksgui" ./cmd/socksgui-gio
          echo "socksgui (Gio): $(stat -c%s "$RUNNER_TEMP/socksgui") bytes"
      - name: Test
        run: go test -count=1 ./internal/...

  gui-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet and build Gio GUI
        run: |
          go vet ./internal/... ./cmd/socksctl ./cmd/socksgui-gio
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/socksgui" ./cmd/socksgui-gio
          echo "socksgui (Gio): $(stat -f%z "$RUNNER_TEMP/socksgui") bytes"

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Fetch core (minimal sing-box)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-core.sh

      - name: Vet
        run: go vet ./internal/... ./cmd/socksgui-gio ./cmd/socksctl

      - name: Test
        run: go test -count=1 ./internal/...

      # CLI Linux/macOS: pastikan tetap bisa dikompilasi untuk setiap target.
      - name: Cross-compile socksctl (linux, macOS)
        run: |
          out="${RUNNER_TEMP:-/tmp}/socksctl-cross"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%%/*}" GOARCH="${target##*/}" CGO_ENABLED=0 \
              go build -o "$out" ./cmd/socksctl
            echo "ok $target ($(stat -c%s "$out" 2>/dev/null || stat -f%z "$out") bytes)"
            rm -f "$out"
          done

      - name: Build Gio GUI (Windows)
        run: |
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -H windowsgui" -o SocksClient.exe ./cmd/socksgui-gio
          echo "SocksClient.exe: $(stat -c%s SocksClient.exe) bytes"
