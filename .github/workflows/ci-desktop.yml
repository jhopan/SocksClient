name: CI (Desktop)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  # GUI native hanya bisa dibangun di platformnya (cgo GTK3 / cgo AppKit).
  # Ini gerbang tiap push supaya shell GUI tidak rusak tanpa terlihat.
  gui-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GTK3 dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev >/dev/null

      - name: Vet and build GTK3 GUI
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/socksgui-gtk" ./cmd/socksgui-gtk
          echo "socksgui (GTK3): $(stat -c%s "$RUNNER_TEMP/socksgui-gtk") bytes"

  gui-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet and build AppKit GUI
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/socksgui-mac" ./cmd/socksgui-mac
          echo "socksgui (AppKit): $(stat -f%z "$RUNNER_TEMP/socksgui-mac") bytes"

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Fetch core (minimal sing-box)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-core.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # CLI Linux/macOS: pastikan tetap bisa dikompilasi untuk setiap target yang
      # dirilis, termasuk build tag root_unix.go.
      - name: Cross-compile socksctl (linux, macOS)
        working-directory: desktop
        run: |
          out="${RUNNER_TEMP:-/tmp}/socksctl-cross"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%%/*}" GOARCH="${target##*/}" CGO_ENABLED=0 \
              go build -o "$out" ./cmd/socksctl
            echo "ok $target ($(stat -c%s "$out" 2>/dev/null || stat -f%z "$out") bytes)"
            rm -f "$out"
          done

      - name: Build
        run: go build -ldflags="-s -w -H windowsgui" -o socks-client.exe .
