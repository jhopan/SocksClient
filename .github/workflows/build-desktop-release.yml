name: Build & Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Fetch core (minimal sing-box)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-core.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup GCC (CGO)
        run: |
          choco install mingw -y

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y

      - name: Fetch core (minimal sing-box)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-core.sh

      - name: Compile Resources
        run: |
          windres -o rsrc_windows_amd64.syso app.rc

      - name: Build exe
        run: |
          go build -ldflags="-s -w -H windowsgui" -o socks-client.exe .

      - name: Build Installer
        run: |
          ISCC.exe setup.iss

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'appVersion' main.go | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocksClientDesktop-Setup
          path: desktop/installer_output/*.exe

      - name: Upload app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocksClientDesktop-exe
          path: desktop/socks-client.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/installer_output/*.exe
          name: "Socks Client Desktop ${{ env.VERSION }}"
          body: |
            ## Socks Client Desktop ${{ env.VERSION }}

            Desktop SOCKS5 client for Windows.

            ### Installer
            - `SocksClientDesktop_Setup_v${{ env.VERSION }}.exe`

            ### What's new
            - Connection mode selector: **TUN** (all traffic through the tunnel) or **Proxy** (no TUN, no admin)
            - Proxy mode runs a local SOCKS5 + HTTP inbound and points the Windows system proxy at it
            - Proxy settings are restored exactly as found on disconnect (crash-safe)
            - If TUN fails to start, the app offers to switch to proxy mode
            - Runtime files (settings, config, log, sing-box.exe) moved to `%LOCALAPPDATA%\SocksClientDesktop`
            - Proxy mode works without Administrator rights (TUN re-launches elevated on demand)

            ### Install
            1. Download the installer
            2. Run it (admin is required to write into Program Files)
            3. Pick a mode on first launch

            ### Requirements
            - Windows 10/11 (64-bit)
            - Administrator only for TUN mode
          draft: false
          prerelease: false
