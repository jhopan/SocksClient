name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fetch core (libbox.aar)
        run: bash scripts/fetch-core.sh

      # S1: APK rilis ditandatangani kunci rilis (rahasia repo), bukan kunci debug.
      # Kalau secret belum ada, gradle jatuh kembali ke kunci debug dan langkah
      # verifikasi di bawah akan menolak hasilnya - sengaja, supaya tidak pernah
      # ada rilis yang diam-diam ditandatangani kunci debug.
      - name: Prepare release keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 belum diisi - rilis ditolak"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signature
        run: |
          cd app/build/outputs/apk/release
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in *.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk" | sed -n '1,3p'
            if "$APKSIGNER" verify --print-certs "$apk" | grep -qi "Android Debug"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          VERSION=$(grep 'versionName' ../../../../build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          mv app-arm64-v8a-release.apk "SocksClient-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "SocksClient-${VERSION}-armeabi-v7a.apk"
          mv app-universal-release.apk "SocksClient-${VERSION}-universal.apk"
          ls -lh *.apk

      - name: Write SHA256SUMS
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocksClient-APKs
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt

      # Kebijakan rilis: hanya tiga rilis yang dipertahankan - core, APK terbaru,
      # installer terbaru. Rilis lama dihapus di sini supaya halaman Releases tetap
      # bersih tanpa perlu aksi manual. Tag git-nya TIDAK dihapus.
      # Kebijakan rilis: hanya tiga rilis yang dipertahankan - core, APK terbaru,
      # installer terbaru. Rilis lama dihapus di sini supaya halaman Releases tetap
      # bersih tanpa perlu aksi manual. Tag git-nya TIDAK dihapus.
      # Catatan: `|| true` pada grep penting - kalau tidak ada rilis lama, grep
      # keluar 1 dan `-o pipefail` menggagalkan step ini.
      - name: Delete superseded releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
                  | grep -E '^v[0-9]' | grep -v "^v${{ env.VERSION }}$" || true)
          for tag in $old; do
            echo "menghapus rilis lama: $tag"
            gh release delete "$tag" --yes || true
          done

      # Re-run harus idempotent: kalau rilis untuk tag ini sudah ada (mis. job
      # dijalankan ulang), hapus dulu supaya upload aset tidak bentrok.
      - name: Reset current release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          name: "Socks Client ${{ env.VERSION }}"
          body: |
            ## Socks Client ${{ env.VERSION }} - Android

            SOCKS5 tunnel client. **All** traffic leaves the phone through your SOCKS5
            server - TCP, UDP and DNS - with no DNS leak and no IPv6 escape. Built for
            mobile hotspots: TUN stack pinned to `gvisor`, MTU `1400`, DNS captured
            inside the tunnel.

            ### Download
            | File | Architecture | For |
            |------|--------------|-----|
            | `SocksClient-${{ env.VERSION }}-arm64-v8a.apk` | arm64-v8a (64-bit) | almost every phone from ~2016 onwards |
            | `SocksClient-${{ env.VERSION }}-armeabi-v7a.apk` | armeabi-v7a (32-bit) | older or low-end devices |
            | `SocksClient-${{ env.VERSION }}-universal.apk` | all ABIs | when unsure; larger download |

            ### What is in this build
            - TUN mode only, on a minimal sing-box core 1.14.1 (socks/http/mixed/tun/direct/block/local-DNS only - no unused protocol code)
            - TUN stack pinned to `gvisor`, MTU pinned to `1400`
            - DNS cannot leak: VPN DNS plus `hijack-dns`, no public resolver at the OS layer, IPv6 routed into the tunnel and then rejected
            - `HTTP ping` On/Off: `GET http://www.gstatic.com/generate_204` every 30 s, also keeps the SOCKS path warm; Off means zero extra traffic
            - Survives network switches (default-network callback reloads sing-box) and dark screens (foreground service type `systemExempted`, 10 s heartbeat)
            - Server password stored encrypted with an Android Keystore AES-GCM key
            - Server address must be an **IP literal** - a hostname would be resolved outside the tunnel

            ### Install
            1. Download the APK matching your phone's architecture.
            2. Open it and allow installs from this source if Android asks.
            3. Launch it, enter the server IP and port (plus user/password if your server needs them), tap **Connect** and accept the VPN prompt.
            4. A later build installs over this one without uninstalling, because every release since 1.3.0 is signed with the same project key.

            ```bash
            adb install -r SocksClient-${{ env.VERSION }}-arm64-v8a.apk
            ```

            ### Verify the download
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
            Signed with the project release key, never the Android debug key:

            ```
            Signer: CN=Socks Client, OU=JhopanStore, O=JhopanStore, C=ID
            SHA-256: 3130e33f139271f5216fbfa150f5f1666fd1c0ba7f6e02455f1fbda37a845886
            # check it yourself:
            apksigner verify --print-certs <apk>
            ```

            ### Requirements
            - Android 7.0 or newer (minSdk 24), arm64-v8a or armeabi-v7a
            - A reachable SOCKS5 server that accepts TCP and (optionally) UDP associate

            ### Links
            - Windows installer: `desktop-v${{ env.VERSION }}` release
            - Tunnel core (sing-box, built here): `core` release
            - Source, QA checklist and troubleshooting table: see the repository README
          draft: false
          prerelease: false
