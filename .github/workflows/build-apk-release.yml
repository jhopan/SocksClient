name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          VERSION=$(grep 'versionName' ../../../../build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          mv app-arm64-v8a-release.apk "SocksClient-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "SocksClient-${VERSION}-armeabi-v7a.apk"
          mv app-universal-release.apk "SocksClient-${VERSION}-universal.apk"
          ls -lh *.apk

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocksClient-APKs
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          name: "Socks Client ${{ env.VERSION }}"
          body: |
            ## Socks Client ${{ env.VERSION }}

            ### Download APK
            | File | Architecture | Notes |
            |------|--------------|-------|
            | `SocksClient-${{ env.VERSION }}-arm64-v8a.apk` | 64-bit | modern devices |
            | `SocksClient-${{ env.VERSION }}-armeabi-v7a.apk` | 32-bit | older devices |
            | `SocksClient-${{ env.VERSION }}-universal.apk` | all | works everywhere |

            Windows desktop installer: see the `desktop-v${{ env.VERSION }}` release.
          draft: false
          prerelease: false
