name: GUI build probe (sementara)

# Sekali pakai: kompilasi dua shell GUI native di runner yang tepat
# (cgo GTK3 hanya bisa dibangun di Linux, cgo AppKit hanya di macOS).
# Dihapus setelah keduanya hijau dan ukurannya tercatat.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-gtk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GTK3 dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev >/dev/null

      - name: Vet + build GUI GTK3
        run: |
          go vet ./... 2>&1 | tail -20
          go build -trimpath -ldflags "-s -w" -o /tmp/socksgui-gtk ./cmd/socksgui-gtk
          ls -la /tmp/socksgui-gtk
          echo "GTK_BIN_BYTES=$(stat -c%s /tmp/socksgui-gtk)" >> $GITHUB_ENV
          ldd /tmp/socksgui-gtk 2>/dev/null | head -12 || true

  macos-appkit:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet + build GUI AppKit
        run: |
          go vet ./... 2>&1 | tail -20
          go build -trimpath -ldflags "-s -w" -o /tmp/socksgui-mac ./cmd/socksgui-mac
          ls -la /tmp/socksgui-mac
          echo "MAC_BIN_BYTES=$(stat -c%s /tmp/socksgui-mac)" >> $GITHUB_ENV
          otool -L /tmp/socksgui-mac 2>/dev/null | head -8 || true
